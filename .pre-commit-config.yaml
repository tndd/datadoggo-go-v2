repos:
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.2
    hooks:
      - id: golangci-lint
        name: golangci-lint
        description: Goコードの静的解析
        args: [--config=.golangci.yml]
      - id: go-test-mod
        name: go-test
        description: Goテストの実行

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: 行末の空白を削除
      - id: end-of-file-fixer
        name: ファイル末尾の改行を修正
      - id: check-yaml
        name: YAML構文チェック
      - id: check-json
        name: JSON構文チェック
      - id: check-merge-conflict
        name: マージコンフリクトの確認
