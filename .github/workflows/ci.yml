name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  GOFLAGS: -buildvcs=false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Goをセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: golangci-lintを実行
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest  # 最新バージョンを指定（古いビルドを避ける）
          args: --config=.golangci.yml  # .golangci.yml を使用

  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Goをセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 依存関係を取得
        run: go mod download

      - name: ビルドを実行
        run: go build ./...

      - name: テストを実行（カバレッジ付き）
        run: go test -v -coverprofile=coverage.out ./...

      - name: 'カバレッジレポートをアップロード（オプション: Codecov使用）'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}  # Codecovトークンをシークレットに設定
