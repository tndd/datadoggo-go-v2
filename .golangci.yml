# プロジェクト共通のgolangci-lint設定。Go 1.23に合わせた推奨構成。
# 主に静的解析の品質とフォーマッタ統一を両立させる。

version: "2"  # バージョン2形式を明示的に指定（必須）

run:
  go: "1.23"  # Goバージョンをここで指定（ルートレベルで有効）

linters:
  enable:
    - errcheck
    - govet
    - nolintlint  # nolintlintを有効化
    - revive
    - staticcheck  # staticcheckを有効化

linters-settings:
  gocyclo:
    min-complexity: 15  # 複雑度閾値（推奨値例）
  nolintlint:
    allow-unused: false  # 公式推奨: 未使用のnolintを許可しない
    require-explanation: true  # 説明を必須にする
    require-specific: true  # 特定のlinterを指定必須
  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: unused-parameter
        severity: warning
      - name: exported
        severity: warning
        arguments:
          - disableStutteringCheck
      - name: if-return
      - name: range-val-in-closure
      - name: context-as-argument
        arguments:
          - context.Context
      - name: time-naming
      - name: error-naming
      - name: empty-block
        arguments:
          - allowComments
      - name: blank-imports
  staticcheck:
    checks: ["all"]  # 公式推奨: すべてのチェックを有効化（必要に応じてカスタマイズ）
  errcheck:
    check-type-assertions: true
    check-blank: true

# 注意: gocycloは15を超える複雑度で検知するため、ロジックを整理できる箇所は早めに分割する。
# 注意: reviveのseverityはwarningにしているが、CIでは警告として扱いつつ継続的に解消する運用を想定。
