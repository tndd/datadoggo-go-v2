# プロジェクト共通のgolangci-lint設定。Go 1.25.1に合わせた推奨構成。
# 主に静的解析の品質とフォーマッタ統一を両立させる。
version: "2"

run:
  go: "1.25"
  timeout: 5m
  modules-download-mode: readonly
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - gocyclo
    - ineffassign
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
    - bodyclose
    - sqlclosecheck
    - noctx
  settings:
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
