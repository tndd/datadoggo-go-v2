# プロジェクト共通のgolangci-lint設定。Go 1.23に合わせた推奨構成。
# 主に静的解析の品質とフォーマッタ統一を両立させる。
version: "2"

run:
  go: "1.23"
  timeout: 5m
  modules-download-mode: readonly
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true

issues:
  max-per-linter: 0
  max-same: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gocyclo
    - ineffassign
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocyclo:
      min-complexity: 15
    nolintlint:
      allow-leading-space: false
      require-explanation: true
      require-specific: true
    revive:
      ignore-generated-header: true
      severity: warning
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: if-return
        - name: range-val-in-closure
        - name: context-as-argument
        - name: time-naming
        - name: error-naming
        - name: empty-block
          arguments:
            - allowComments
        - name: blank-imports
    errcheck:
      check-type-assertions: true
      check-blank: false

# 注意: gocycloは15を超える複雑度で検知するため、ロジックを整理できる箇所は早めに分割する。
# 注意: reviveのseverityはwarningにしているが、CIでは警告として扱いつつ継続的に解消する運用を想定。
